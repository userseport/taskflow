.hover\:border-indigo-500:hover{border-color:var(--ac)!important}.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acl)}

.dark .card{background:#1a1e2e;border-color:#2a2f42}.dark .inp{background:#171b2b;border-color:#2c3142;color:#e5e7eb}
.dark .bg-white{background:#151927!important}.dark .border-slate-200,.dark .border-slate-300{border-color:#2a2f42!important}
.dark .text-slate-700,.dark .text-slate-600{color:#cbd5e1!important}.dark .text-slate-500{color:#94a3b8!important}.dark .text-slate-400{color:#7c879b!important}
.dark .bg-slate-100{background:#262b3f!important}.dark .hover\:bg-slate-100:hover,.dark .hover\:bg-slate-200:hover,.dark .hover\:bg-slate-50:hover{background:#30364d!important}
.dark .bg-emerald-50,.dark .bg-amber-50,.dark .bg-rose-50,.dark .bg-rose-100{background:#ffffff14!important}
.dark .text-emerald-700{color:#6ee7b7!important}.dark .text-amber-700{color:#fcd34d!important}.dark .text-rose-700,.dark .text-rose-600{color:#fda4af!important}
.compact .card.p-4{padding:.5rem .75rem!important}

const beep=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.start();o.stop(c.currentTime+.3)}catch(e){}};
const streakOf=l=>{let s=0,i=l.includes(today())?0:1;while(l.includes(addD(-i))&&s<400){s++;i++}return s};

const QT=['Маленькие шаги каждый день дают большие результаты.','Начни с главного, остальное подождёт.','Делай сейчас то, что завтра скажет тебе «спасибо».','Сложное перестаёт пугать, когда разбито на части.','План без первого действия — всего лишь мечта.','Дисциплина — это мост между целями и результатами.','Не сравнивай свой первый шаг с чужим сотым.','Отдых — часть продуктивности, а не её враг.','Сделанное несовершенно лучше идеального, которое не начато.','Каждый выполненный пункт — маленькая победа.','Фокус на одном деле сильнее многозадачности.','Сегодняшний день — лучшее время начать.'];

const playMus=(k,v)=>{try{if(MUS.s){MUS.s.stop();MUS.s=null}MUS.k=k;if(k==='off')return;const c=MUS.c||(MUS.c=new(window.AudioContext||window.webkitAudioContext)());c.resume&&c.resume();const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=k==='rain'?w*.5:l*3.5}const s=c.createBufferSource();s.buffer=b;s.loop=true;const f=c.createBiquadFilter();f.type=k==='rain'?'highpass':'lowpass';f.frequency.value=k==='rain'?1500:k==='ocean'?500:900;const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);if(k==='ocean'){const o=c.createOscillator(),og=c.createGain();o.frequency.value=.12;og.gain.value=v*.6;o.connect(og);og.connect(g.gain);o.start()}s.start();MUS.s=s;MUS.g=g}catch(e){}};

const L=({t,children})=>html`<label className="block text-xs font-medium text-slate-500 mb-1">${t}${children}</label>`;
function Modal({task,cats,onSave,onClose,onCat,toast}){

<${L} t='Теги (через запятую)'><input className='inp mt-1' value=${f.tags||''} onChange=${e=>set('tags',e.target.value)}/><//>

<div><div className='text-xs text-slate-500 mb-1'>Подзадачи</div>${(f.subs||[]).map((s,i)=>html`<div key=${i} className='flex gap-2 mb-1'><input className='inp' value=${s.t} onChange=${e=>set('subs',f.subs.map((x,j)=>j===i?{...x,t:e.target.value}:x))}/><button className='btn px-2 text-slate-400' onClick=${()=>set('subs',f.subs.filter((_,j)=>j!==i))}><${Ic} n='x' c='w-4 h-4'/></button></div>`)}<button className='btn text-sm text-indigo-600' onClick=${()=>set('subs',[...(f.subs||[]),{t:'',d:false}])}>+ Подзадача</button></div>

function Stats({tasks,pref}){
const log=pref.log||[];const days=[...Array(7)].map((_,i)=>{const d=addD(i-6);return{d,n:log.filter(x=>x===d).length}});const mx=Math.max(1,...days.map(x=>x.n));const sk=streakOf(log);const wk=a=>log.filter(x=>x>=addD(-a-6)&&x<=addD(-a)).length;const w1=wk(0),w0=wk(7),best=days.reduce((a,b)=>b.n>a.n?b:a,days[0]),ov=tasks.filter(isOver).length;
const cs=[...new Set(tasks.map(t=>t.cat))].map(c=>({c,n:tasks.filter(t=>t.cat===c).length,d:tasks.filter(t=>t.cat===c&&t.done).length}));
const B=[[1,'Первая задача'],[10,'10 задач'],[50,'50 задач']].map(([n,l])=>[log.length>=n,l]).concat([[sk>=3,'Серия 3 дня'],[sk>=7,'Серия 7 дней']]);
return html`<div className='grid md:grid-cols-2 gap-4'>

const TM={on:false,end:0,rem:1500e3,total:1500e3,name:'',tid:'',fin:false,to:0};
function Focus({tasks,setTasks,toast}){
const [,f]=useState(0);useEffect(()=>{const i=setInterval(()=>f(x=>x+1),500);return()=>clearInterval(i)},[]);
const [mins,setMins]=useState(Math.round(TM.total/6e4));
const left=TM.on?Math.max(0,TM.end-Date.now()):TM.rem;const sec=Math.ceil(left/1000);
const start=()=>{if(!TM.on){if(!TM.name.trim()){toast('Введите задачу',1);return}if(TM.rem<=0)TM.rem=TM.total;TM.fin=false;TM.on=true;TM.end=Date.now()+TM.rem;clearTimeout(TM.to);TM.to=setTimeout(()=>{TM.on=false;TM.fin=true;TM.rem=0;beep()},TM.rem)}else{TM.on=false;TM.rem=TM.end-Date.now();clearTimeout(TM.to)}f(x=>x+1)};
const reset=()=>{clearTimeout(TM.to);TM.on=false;TM.fin=false;TM.rem=TM.total;f(x=>x+1)};
const setM=m=>{m=Math.max(1,Math.min(600,+m||1));setMins(m);clearTimeout(TM.to);TM.on=false;TM.fin=false;TM.total=TM.rem=m*6e4};
return html`<div className='card p-8 max-w-md mx-auto text-center'>
<select className='inp mb-2' value=${TM.tid} onChange=${e=>{const t=tasks.find(x=>String(x.id)===e.target.value);TM.tid=e.target.value;if(t)TM.name=t.title;f(x=>x+1)}}><option value=''>Выбрать из моих задач</option>${tasks.filter(t=>!t.done).map(t=>html`<option key=${t.id} value=${t.id}>${t.title}</option>`)}</select>
<input className='inp' placeholder='Или введите задачу' value=${TM.name} onChange=${e=>{TM.name=e.target.value;TM.tid='';f(x=>x+1)}}/>
<div className='flex items-center justify-center gap-2 mt-4 text-sm'>Время, мин: <input type='number' min='1' max='600' className='inp !w-20 text-center' value=${mins} disabled=${TM.on} onChange=${e=>setM(e.target.value)}/></div>
<div className='flex flex-wrap justify-center gap-2 mt-3'>${[5,15,25,45,60].map(m=>html`<button key=${m} disabled=${TM.on} onClick=${()=>setM(m)} className='btn px-3 py-1 rounded-lg text-xs bg-slate-100 disabled:opacity-40'>${m} мин</button>`)}</div>
<div className='text-6xl font-semibold my-6 tabular-nums'>${pad(Math.floor(sec/60))}:${pad(sec%60)}</div>
${TM.fin&&html`<div className='mb-3 text-emerald-600 font-medium'>Время вышло!</div>`}
<div className='flex flex-wrap gap-2 justify-center'><button onClick=${start} className='btn px-5 py-2 rounded-xl text-sm text-white bg-indigo-600'>${TM.on?'Пауза':'Старт'}</button><button onClick=${reset} className='btn px-4 py-2 rounded-xl text-sm bg-slate-100'>Сброс</button>${TM.fin&&TM.tid&&html`<button onClick=${()=>{setTasks(ts=>ts.map(x=>String(x.id)===TM.tid?{...x,done:true}:x));TM.tid='';toast('Задача выполнена');f(x=>x+1)}} className='btn px-4 py-2 rounded-xl text-sm bg-emerald-50 text-emerald-700'>Отметить выполненной</button>`}</div></div>`}

function FocusOld({tasks}){

function Trash({trash,setTrash,setTasks,toast}){
